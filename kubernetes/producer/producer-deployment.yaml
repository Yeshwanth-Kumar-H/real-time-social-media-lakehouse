apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-producer
  labels:
    app: social-media-producer
    tier: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-media-producer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: social-media-producer
        tier: ingestion
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: producer
          image: social-media-producer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: producer-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
