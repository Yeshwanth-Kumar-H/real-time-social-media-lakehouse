apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: kafka
    tier: streaming
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30094
      protocol: TCP
